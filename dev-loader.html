<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOAN Plus - Development Loader</title>
    <style>
      body {
        background: #f4f2ec;
        color: #17211d;
        font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        margin: 48px auto;
        max-width: 680px;
        padding: 0 20px;
      }
      h1 {
        font-family: Georgia, "Yu Mincho", serif;
      }
      code {
        background: #e8e4db;
        padding: 2px 5px;
      }
      li {
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <h1>KOAN Plus</h1>
    <p>このフォルダは開発用です。通常利用ではビルド済みの <code>dist/</code> を読み込んでください。</p>
    <ol>
      <li>ターミナルで <code>npm run build</code> を実行する。</li>
      <li><code>chrome://extensions</code> を開く。</li>
      <li>この開発用拡張を削除する。</li>
      <li>「パッケージ化されていない拡張機能を読み込む」で <code>~/Projects/KOAN Plus/dist</code> を選ぶ。</li>
    </ol>
  </body>
</html>
